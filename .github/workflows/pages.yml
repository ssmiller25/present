name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reveal-md
        run: npm install -g reveal-md@5.5.1

      - name: Build static site
        run: reveal-md presentations/ --static _site --listing-template template/index.html

      - name: Copy CSS assets
        run: cp css/*.css _site/css/

      - name: Copy presentation assets (images, etc.)
        run: rsync -av --exclude='*.md' presentations/ _site/

      - name: Add CNAME for custom domain
        run: echo "present.r15cookie.com" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
